<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CloudOS</title>
<style>
:root{--top:0px;--gap:92px;--r:12px;--accent:#0a84ff;--fg:#1d1d1f;--win:rgba(250,250,252,.93);--bar:rgba(236,236,241,.97);--glass:rgba(255,255,255,.58);--line:rgba(0,0,0,.13);--card:rgba(0,0,0,.06);--sh:0 22px 60px rgba(0,0,0,.35)}
body.dark{--fg:#f5f5f7;--win:rgba(34,34,38,.94);--bar:rgba(52,52,58,.97);--glass:rgba(32,32,36,.6);--line:rgba(255,255,255,.15);--card:rgba(255,255,255,.09)}
body.mac{--top:28px;--gap:92px;--r:12px}
body.wn{--top:0px;--gap:52px;--r:8px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,Roboto,sans-serif;color:var(--fg);user-select:none;-webkit-user-select:none;touch-action:none;font-size:14px}
body{background-size:cover;background-position:center;transition:background .6s}
button{font:inherit}
.maconly,.winonly{display:none!important}
body.mac .maconly{display:flex!important}
body.wn .winonly{display:flex!important}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999999;transition:opacity .2s}

/* menubar */
#menubar{position:absolute;top:0;left:0;right:0;height:28px;align-items:center;padding:0 8px;gap:2px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);font-size:13px;z-index:99990;box-shadow:0 1px 0 var(--line)}
#menubar .mb{background:none;border:0;color:inherit;padding:2px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
#menubar .mb:hover,#menubar .mb.open{background:var(--card)}
#menubar b.mb{font-weight:700}
#menubar .sp{flex:1}
.tray{display:flex;align-items:center;gap:10px;font-size:13px}
.tray .mb{padding:2px 6px}

#desk{position:absolute;left:0;right:0;top:var(--top);bottom:0;overflow:hidden}
#icons{position:absolute;inset:0;pointer-events:none}
.dicon{position:absolute;width:84px;text-align:center;pointer-events:auto;cursor:default;padding:4px;border-radius:8px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);font-size:12px}
.dicon .ic{margin:0 auto 4px}
.dicon span.n{display:block;word-break:break-word;line-height:1.2}
.dicon.sel{background:rgba(255,255,255,.25)}
body.mac .dicon{right:12px}
body.wn .dicon{left:12px}

/* app icon */
.ic{display:grid;place-items:center;border-radius:23%;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 2px 6px rgba(0,0,0,.3);flex:none}

/* dock / taskbar */
#dock{position:absolute;z-index:99980;display:flex;align-items:center;gap:4px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--line)}
body.mac #dock{bottom:8px;left:50%;transform:translateX(-50%);padding:7px 10px;border-radius:24px;max-width:98vw}
body.wn #dock{bottom:0;left:0;right:0;height:48px;justify-content:center;border-radius:0;border-width:1px 0 0}
.di{position:relative;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:inherit;padding:0;transform-origin:50% 100%;transition:transform .12s}
body.mac .di{width:52px;height:56px}
body.wn .di{width:42px;height:40px;border-radius:6px}
body.wn .di:hover{background:var(--card)}
.di.winonly{justify-content:center;align-items:center}
body.mac #dock .tray{display:none}
@media(max-width:1100px){body.wn #dock .tray .bat{display:none}}
.di::after{content:"";position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--fg);opacity:0}
body.wn .di::after{bottom:0;width:14px;height:3px;border-radius:3px;background:var(--accent)}
.di.on::after{opacity:.85}
.di.bounce{animation:bounce .5s ease 2}
@keyframes bounce{50%{transform:translateY(-22px)}}
#dock .sep{width:1px;height:34px;background:var(--line);margin:0 4px}
body.wn #dock .sep{display:none}
body.wn #dock .tray{position:absolute;right:8px}
body.wn #dock .tray .mb{background:none;border:0;color:inherit;cursor:pointer;padding:4px 8px;border-radius:6px;font-size:12px;line-height:1.2;text-align:right}
body.wn #dock .tray .mb:hover{background:var(--card)}
@media(max-width:720px){body.mac #dock{overflow-x:auto;justify-content:flex-start}body.mac .di{width:46px;flex:none}body.wn #dock{justify-content:flex-start;overflow-x:auto;padding-right:90px}}
.tip{position:fixed;background:var(--glass);backdrop-filter:blur(20px);padding:3px 10px;border-radius:6px;font-size:12px;pointer-events:none;z-index:99999;border:1px solid var(--line);display:none}

/* launchpad / start */
#launch{position:absolute;z-index:99970;display:flex;opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.05);transition:opacity .32s ease,transform .32s ease,visibility 0s linear .32s;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:6px;background:var(--glass);backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5)}
#launch.show{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .32s ease,transform .32s ease,visibility 0s}
body.mac #launch{z-index:99983;inset:0;padding:60px 40px 120px;overflow:auto;background:rgba(20,20,30,.45)}
body.wn #launch{bottom:58px;left:50%;transform:translateX(-50%);width:min(560px,96vw);max-height:70vh;overflow:auto;padding:20px;border-radius:12px;border:1px solid var(--line)}
#launch button{width:96px;border:0;background:none;color:inherit;cursor:pointer;padding:10px 4px;border-radius:10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
body.mac #launch button{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#launch button:hover{background:var(--card)}
@keyframes fade{from{opacity:0}}

/* windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;min-width:240px;min-height:150px;animation:pop .2s ease}
.win:not(.focus){box-shadow:0 8px 24px rgba(0,0,0,.25)}
.win.min{display:none}
.win.minning{animation:minn .2s ease forwards}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--gap))!important;border-radius:0}
@keyframes pop{from{transform:scale(.93);opacity:0}}
@keyframes minn{to{transform:translateY(55vh) scale(.25);opacity:0}}
.bar{display:flex;align-items:center;background:var(--bar);height:38px;padding:0 12px;cursor:grab;flex:none;font-size:13px;touch-action:none;border-bottom:1px solid var(--line)}
.win:not(.focus) .bar{opacity:.78}
.bar .ttl{flex:1;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ctl{display:flex;gap:8px}
.c{border:0;padding:0;cursor:pointer;color:inherit;background:none}
body.mac .c{width:13px;height:13px;border-radius:50%;font-size:9px;line-height:13px;color:transparent;font-weight:800}
body.mac .ctl:hover .c.close::before{content:"✕";color:rgba(0,0,0,.55)}
body.mac .ctl:hover .c.min::before{content:"–";color:rgba(0,0,0,.55)}
body.mac .ctl:hover .c.max::before{content:"+";color:rgba(0,0,0,.55)}
body.mac .c.close{background:#ff5f57}body.mac .c.min{background:#febc2e}body.mac .c.max{background:#28c840}
body.mac .win:not(.focus) .c{background:#9a9a9f}
body.wn .bar{padding:0 0 0 12px;height:34px}
body.wn .bar .ttl{order:1;text-align:left}
body.wn .ctl{order:2;gap:0;height:100%}
body.wn .c{width:46px;height:34px;font-size:12px}
body.wn .c:hover{background:var(--card)}
body.wn .c.close:hover{background:#c42b1c;color:#fff}
body.wn .c.min::before{content:"–"}body.wn .c.max::before{content:"▢"}body.wn .c.close::before{content:"✕"}
.body{flex:1;overflow:auto;user-select:text;-webkit-user-select:text;touch-action:auto;position:relative;min-height:0}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:5}
.win.max .rs{display:none}
.snapprev{position:absolute;background:rgba(120,160,255,.25);border:2px solid rgba(120,160,255,.7);border-radius:12px;pointer-events:none;z-index:99000;display:none}

/* menus, panels, toasts */
.menu{position:fixed;min-width:210px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--line);border-radius:10px;padding:5px;z-index:9999990;box-shadow:0 12px 36px rgba(0,0,0,.35);font-size:13px;animation:fade .1s}
.menu div{padding:5px 12px;border-radius:5px;cursor:default;white-space:nowrap}
.menu div:hover{background:var(--accent);color:#fff}
.menu div.off{opacity:.4;pointer-events:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 6px}
#spot{position:absolute;inset:0;z-index:9999980;display:none;justify-content:center;align-items:flex-start;padding-top:14vh;background:rgba(0,0,0,.18)}
#spot.show{display:flex}
#spot .box{width:min(620px,94vw);background:var(--glass);backdrop-filter:blur(36px) saturate(1.6);-webkit-backdrop-filter:blur(36px) saturate(1.6);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.45);overflow:hidden}
#spot input{width:100%;border:0;outline:0;background:none;color:inherit;font-size:22px;padding:16px 20px;user-select:text;-webkit-user-select:text}
#spot .res{max-height:50vh;overflow:auto;border-top:1px solid var(--line)}
#spot .res:empty{display:none}
#spot .it{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer}
#spot .it.act{background:var(--accent);color:#fff}
#spot .it small{opacity:.65;margin-left:auto}
#cc{position:absolute;z-index:99985;width:min(340px,94vw);padding:12px;border-radius:18px;background:var(--glass);backdrop-filter:blur(34px) saturate(1.6);-webkit-backdrop-filter:blur(34px) saturate(1.6);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.4);display:none;gap:10px;flex-wrap:wrap}
#cc.show{display:flex;animation:fade .12s}
body.mac #cc{top:34px;right:8px}
body.wn #cc{bottom:58px;right:8px}
#cc .tile{flex:1 1 44%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);cursor:pointer;border:0;color:inherit;text-align:left}
#cc .tile.on{background:var(--accent);color:#fff}
#cc .tile small{display:block;opacity:.7;font-size:11px}
#cc .sl{flex:1 1 100%;background:var(--card);border-radius:12px;padding:10px 12px;font-size:12px}
#cc input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
#toasts{position:absolute;right:10px;z-index:99995;display:flex;flex-direction:column;gap:8px;pointer-events:none}
body.mac #toasts{top:36px}body.wn #toasts{bottom:60px}
.toast{width:300px;padding:10px 14px;border-radius:14px;background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:tin .3s ease;font-size:13px}
.toast b{display:block;margin-bottom:2px}
@keyframes tin{from{transform:translateX(120%);opacity:0}}

/* lock + boot */
#lock{position:absolute;inset:0;z-index:999990;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(0,0,0,.18);transition:opacity .5s,transform .5s;cursor:pointer}
#lock.show{display:flex}
#lock.out{opacity:0;transform:scale(1.04);pointer-events:none}
#lock .t{font-size:clamp(64px,16vw,120px);font-weight:200;letter-spacing:-2px;line-height:1}
#lock .d{font-size:20px;margin-top:6px;opacity:.9}
#lock .av{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:34px;margin-top:8vh;border:2px solid rgba(255,255,255,.5)}
#lock .u{font-size:18px;margin-top:10px;font-weight:600}
#lock .h{font-size:13px;opacity:.75;margin-top:6px}
#boot{position:absolute;inset:0;background:#000;color:#fff;display:grid;place-items:center;z-index:9999995;transition:opacity .8s;text-align:center}
#boot .logo{font-size:84px;line-height:0}#setup .logo{line-height:0;margin-bottom:6px}
#boot .pb{width:190px;height:4px;border-radius:3px;background:rgba(255,255,255,.2);margin:26px auto 0;overflow:hidden}
#boot .pb i{display:block;height:100%;width:0;background:#fff;animation:pb 2.2s ease forwards}
@keyframes pb{to{width:100%}}
#boot.hide{opacity:0;pointer-events:none}

/* app internals */
.fl{display:flex;height:100%}
.fside{width:150px;flex:none;padding:10px 6px;border-right:1px solid var(--line);background:var(--card);overflow:auto}
.fside h5{margin:6px 8px;font-size:11px;opacity:.55;font-weight:600}
.fside div{padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.fside div:hover{background:var(--card)}.fside div.act{background:var(--accent);color:#fff}
.fmain{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb button,.btn{border:0;background:var(--card);color:inherit;border-radius:7px;padding:5px 10px;cursor:pointer}
.tb button:hover,.btn:hover{filter:brightness(.92)}
.btn.pri{background:var(--accent);color:#fff}
.tb .path{flex:1;opacity:.7;font-size:12px;min-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fgrid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;align-content:start}
.fi{text-align:center;padding:8px 4px;border-radius:8px;cursor:default;word-break:break-word;font-size:12px}
.fi:hover{background:var(--card)}.fi.sel{background:var(--accent);color:#fff}
.fi .e{font-size:38px;line-height:1.1}
.fi input{width:100%;font:inherit;font-size:12px;text-align:center;border:1px solid var(--accent);border-radius:4px;background:var(--win);color:inherit;user-select:text;-webkit-user-select:text}
.empty{opacity:.55;padding:20px;text-align:center}
textarea.tx{width:100%;height:100%;border:0;outline:0;resize:none;padding:14px;background:transparent;color:inherit;font:15px/1.55 inherit;user-select:text;-webkit-user-select:text}
.edl{display:flex;flex-direction:column;height:100%}
.edl img{max-width:100%;max-height:100%;margin:auto;display:block}
.nl{display:flex;height:100%}
.nlist{width:170px;flex:none;border-right:1px solid var(--line);overflow:auto;background:var(--card)}
.nlist div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.nlist div b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nlist div small{opacity:.6}.nlist div.act{background:var(--accent);color:#fff}
.calc{display:flex;flex-direction:column;height:100%;padding:10px;gap:8px}
.disp{background:var(--card);border-radius:10px;padding:12px;text-align:right;font-size:30px;min-height:62px;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.keys button{border:0;border-radius:10px;background:var(--card);color:inherit;font-size:19px;cursor:pointer;min-height:38px}
.keys button:active{filter:brightness(.8)}.keys .op{background:var(--accent);color:#fff}
.brw{display:flex;flex-direction:column;height:100%}
.brw .addr{flex:1;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:6px 10px;outline:0;min-width:80px;user-select:text;-webkit-user-select:text}
.brw iframe{flex:1;border:0;background:#fff;width:100%}
.brw .start{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:26px;align-content:start}
.brw .start .sc{text-align:center;cursor:pointer;padding:10px;border-radius:12px}
.brw .start .sc:hover{background:var(--card)}
.brw .start h2{grid-column:1/-1;margin:0 0 6px;font-weight:600}
.brw .note{font-size:11px;opacity:.65;padding:4px 10px;border-top:1px solid var(--line)}
.cal{padding:14px;display:flex;flex-direction:column;gap:10px;height:100%}
.cal .hd{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}.cal .hd span{flex:1}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .gr .dn{opacity:.55;font-size:11px}
.cal .gr .d{padding:7px 0;border-radius:50%;cursor:pointer;position:relative}
.cal .gr .d:hover{background:var(--card)}.cal .gr .d.today{background:var(--accent);color:#fff}
.cal .gr .d.sel{outline:2px solid var(--accent)}
.cal .gr .d.ev::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.cal .evs{border-top:1px solid var(--line);padding-top:8px;overflow:auto;flex:1}
.cal .evs .e{display:flex;gap:6px;padding:4px 0}.cal .evs .e span{flex:1}
.cal input,.wi input,.tmin{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:6px 10px;outline:0;user-select:text;-webkit-user-select:text}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:inherit;padding:6px;border-radius:7px;cursor:pointer}
.tabs button.act{background:var(--accent);color:#fff}
.wc{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.wc b{font-size:24px;font-weight:300}
.big{font-size:54px;font-weight:200;text-align:center;padding:26px 0 10px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;justify-content:center;padding:6px}
.wi{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.wi .t{font-size:64px;font-weight:200;line-height:1}
.wi .fc{width:100%;display:flex;flex-direction:column}
.wi .fc div{display:flex;justify-content:space-between;padding:7px 4px;border-top:1px solid var(--line)}
.term{background:rgba(18,18,20,.95);color:#e8e8e8;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:10px;height:100%;overflow:auto;user-select:text;-webkit-user-select:text}
.term .l{white-space:pre-wrap;word-break:break-word}
.term .pl{display:flex;gap:6px}.term input{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;user-select:text;-webkit-user-select:text}
.term .pr{color:#7ee787;white-space:pre}
.piano{position:relative;height:100%;min-height:150px;display:flex;background:#222;padding:10px 8px 8px}
.piano .w{flex:1;background:#fafafa;border:1px solid #888;border-radius:0 0 6px 6px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;color:#888;font-size:10px;padding-bottom:4px}
.piano .w.on{background:#bcd8ff}
.piano .k{position:absolute;top:10px;height:58%;background:#111;border-radius:0 0 5px 5px;cursor:pointer;z-index:2}
.piano .k.on{background:#3a6df0}
.paint{display:flex;flex-direction:column;height:100%}
.pw{flex:1;position:relative;background:#fff;touch-action:none;overflow:hidden}
.pw canvas{position:absolute;inset:0;touch-action:none}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.act{border-color:var(--accent);box-shadow:0 0 0 2px var(--win)}
.game{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;height:100%;justify-content:center}
.game canvas{max-width:100%;max-height:calc(100% - 90px);background:#101418;border-radius:10px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,46px);gap:4px}
.pad button{height:36px;border:0;border-radius:8px;background:var(--card);color:inherit;font-size:16px;cursor:pointer}
.g48{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#bbada0;padding:8px;border-radius:10px;width:min(300px,86%);aspect-ratio:1;touch-action:none}
.g48 div{border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:22px;background:rgba(238,228,218,.35);color:#776e65}
.mon{padding:12px;display:flex;flex-direction:column;gap:10px;height:100%}
.mon canvas{width:100%;height:90px;background:var(--card);border-radius:8px}
.mon .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12px}.mon .kv b{opacity:.65;font-weight:500}
.mon .pl{flex:1;overflow:auto;border-top:1px solid var(--line)}
.mon .pl div{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}.mon .pl span{flex:1}
.set{display:flex;height:100%}
.sset{width:150px;flex:none;border-right:1px solid var(--line);background:var(--card);padding:8px 6px}

app("mines","Mayın Tarlası","💣","#8e8e93,#3a3a3c",370,490,{},function(b,win){
  var N=9,M=10,cells=[],over=false,first=true,flag=false,t=0,timer=null;
  var info=h("div",{style:"font-size:16px"}),grid=h("div",{style:"display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:min(324px,90%);aspect-ratio:1"});
  var fb=h("button",{class:"btn",text:"🚩 Bayrak: kapalı",onclick:function(){flag=!flag;fb.textContent="🚩 Bayrak: "+(flag?"açık":"kapalı");}});
  b.append(h("div",{class:"game"},[info,grid,h("div",{class:"row"},[fb,h("button",{class:"btn",text:"Yeniden",onclick:function(){reset();}})])]));
  var COL=["","#0a84ff","#34c759","#ff3b30","#5e5ce6","#ff9500","#32ade6","#1d1d1f","#8e8e93"];
  function nb(i){var r=Math.floor(i/N),c=i%N,o=[];for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;var rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)o.push(rr*N+cc);}return o;}
  function reset(){cells=[];for(var i=0;i<N*N;i++)cells.push({m:false,r:false,f:false,n:0});over=false;first=true;t=0;clearInterval(timer);timer=null;draw();}
  function place(safe){var c=0,sn=nb(safe);while(c<M){var i=Math.floor(Math.random()*N*N);if(cells[i].m||i===safe||sn.indexOf(i)>-1)continue;cells[i].m=true;c++;}cells.forEach(function(x,i){x.n=nb(i).filter(function(j){return cells[j].m;}).length;});}
  function reveal(i){var st=[i];while(st.length){var k=st.pop(),c=cells[k];if(c.r||c.f)continue;c.r=true;if(!c.m&&c.n===0)nb(k).forEach(function(j){if(!cells[j].r)st.push(j);});}}
  function act(i,fl){
    if(over)return;var c=cells[i];
    if(fl||flag){if(!c.r)c.f=!c.f;draw();return;}
    if(c.f||c.r)return;
    if(first){first=false;place(i);timer=setInterval(function(){t++;stat();},1000);}
    if(c.m){over=true;clearInterval(timer);cells.forEach(function(x){if(x.m)x.r=true;});tone(120,0.5,"sawtooth",0.3);draw();info.textContent="💥 Mayına bastın! Yeniden başlat.";return;}
    reveal(i);tone(520,0.05,"square",0.12);
    if(cells.every(function(x){return x.m||x.r;})){over=true;clearInterval(timer);draw();info.textContent="🎉 Kazandın! "+t+" sn";notify("Mayın Tarlası","Kazandın! "+t+" saniye");return;}
    draw();
  }
  function stat(){info.textContent="💣 "+(M-cells.filter(function(x){return x.f;}).length)+"  ·  ⏱ "+t+" sn";}
  function draw(){
    grid.innerHTML="";
    cells.forEach(function(c,i){
      var d=h("div",{style:"display:grid;place-items:center;border-radius:5px;font-weight:700;font-size:16px;cursor:pointer;aspect-ratio:1;user-select:none;background:"+(c.r?"var(--card)":"rgba(120,120,135,.55)")+";color:"+(COL[c.n]||"inherit"),text:c.r?(c.m?"💣":(c.n||"")):(c.f?"🚩":"")});
      d.addEventListener("click",function(){act(i,false);});
      d.addEventListener("contextmenu",function(e){e.preventDefault();act(i,true);});
      grid.append(d);
    });
    if(!over)stat();
  }
  win.onclose(function(){clearInterval(timer);});
  reset();
});

    lastTap.t=0;
